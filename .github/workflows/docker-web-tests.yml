name: Docker Web Tests

on:
  push:
    branches:
      - feature/docker-web-hub
      - feature/k8s-helm

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Install Docker Compose v2.24.7
      run: |
        # Скачиваем и устанавливаем Docker Compose v2
        DOCKER_COMPOSE_VERSION="v2.24.7"
        mkdir -p ~/.docker/cli-plugins/
        curl -SL "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" -o ~/.docker/cli-plugins/docker-compose
        chmod +x ~/.docker/cli-plugins/docker-compose
        docker compose version

    - name: Run tests with Docker Compose
      run: |
        # Проверяем наличие docker-compose.yml
        ls -la
        docker compose -f test-repo/docker-compose.yml up --build 

    - name: Build and push app image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest -f test-repo/Dockerfile.app .
        docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest

    - name: Build and push web image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest -f test-repo/Dockerfile.web .
        docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Package Helm chart
      run: |
        helm package helm/test-repo-chart
        ls -la
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Helm Chart Release
        tag_name: v${{ github.run_number }}
        files: |
          test-repo-chart-*.tgz
      env:
        GITHUB_TOKEN: ${{ github.token }}
