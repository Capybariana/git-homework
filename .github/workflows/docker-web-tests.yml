name: Docker Web Tests

on:
  push:
    branches:
      - feature/docker-web-hub

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.15.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Run tests with Docker Compose
      run: |
        docker compose -f docker-compose.yml up --build --exit-code-from app

    - name: Build and push app image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest -f Dockerfile.app .
        docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-app:latest

    - name: Build and push web image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest -f Dockerfile.web .
        docker push ${{ secrets.DOCKER_USERNAME }}/test-repo-web:latest